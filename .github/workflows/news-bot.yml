name: Ring Wraithed WoW Forever Draft Generator

on:
  schedule:
    # Check for new WoW: Forever news every 30 minutes.
    - cron: "*/30 * * * *"
    # Create community question drafts on Monday, Wednesday, Friday at 17:00 UTC.
    - cron: "0 17 * * 1,3,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "Which draft should the bot create?"
        required: true
        type: choice
        options:
          - news
          - community

permissions:
  contents: write

concurrency:
  group: ring-wraithed-draft-generator
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Choose draft mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 17 * * 1,3,5" ]]; then
            echo "mode=community" >> "$GITHUB_OUTPUT"
          else
            echo "mode=news" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate draft
        run: python bot.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Save drafts and history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json drafts/
          if git diff --cached --quiet; then
            echo "No new drafts to save"
          else
            git commit -m "Add WoW Forever post draft"
            git push
          fi
