name: Ring Wraithed WoW Forever Auto Publisher

on:
  push:
    branches: [main]
    paths: [bot.py]
  schedule:
    # Check for new WoW: Forever news every 30 minutes.
    - cron: "*/30 * * * *"
    # Community engagement posts: Monday, Wednesday, Friday at 17:00 UTC.
    - cron: "0 17 * * 1,3,5"
  workflow_dispatch:
    inputs:
      mode:
        description: "What should the bot publish?"
        required: true
        type: choice
        options:
          - news
          - community

permissions:
  contents: write

concurrency:
  group: ring-wraithed-auto-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Choose publishing mode
        id: mode
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "mode=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.event.schedule }}" == "0 17 * * 1,3,5" ]]; then
            echo "mode=community" >> "$GITHUB_OUTPUT"
          else
            echo "mode=news" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to X
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python bot.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Save publication history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json drafts/
          if git diff --cached --quiet; then
            echo "No publication history changes to save"
          else
            git commit -m "Record published WoW Forever posts"
            git push
          fi
