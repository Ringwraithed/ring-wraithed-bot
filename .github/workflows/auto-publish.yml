name: Ring Wraithed automatic X publishing

on:
  schedule:
    - cron: "*/30 * * * *"
    - cron: "0 17 * * 1,3,5"
  workflow_dispatch:
    inputs:
      mode:
        description: What should the bot publish?
        required: true
        type: choice
        options:
          - news
          - community

permissions:
  contents: write

concurrency:
  group: ring-wraithed-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check X credentials
        id: credentials
        env:
          X_API_KEY: \${{ secrets.X_API_KEY }}
          X_API_SECRET: \${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: \${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: \${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: |
          if [ -z "$X_API_KEY" ] || [ -z "$X_API_SECRET" ] || [ -z "$X_ACCESS_TOKEN" ] || [ -z "$X_ACCESS_TOKEN_SECRET" ]; then
            echo "::warning::X credentials are not configured. No post was sent. Add X_API_KEY, X_API_SECRET, X_ACCESS_TOKEN, and X_ACCESS_TOKEN_SECRET in repository Actions secrets."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to X
        if: steps.credentials.outputs.ready == 'true'
        env:
          X_API_KEY: \${{ secrets.X_API_KEY }}
          X_API_SECRET: \${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: \${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: \${{ secrets.X_ACCESS_TOKEN_SECRET }}
          MODE: \${{ github.event_name == 'schedule' && github.event.schedule == '0 17 * * 1,3,5' && 'community' || inputs.mode || 'news' }}
        run: python bot.py --mode "$MODE"

      - name: Save publishing history
        if: steps.credentials.outputs.ready == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json drafts/
          if ! git diff --cached --quiet; then
            git commit -m "Record automated X publication"
            git push
          else
            echo "No publishing state changes to commit."
          fi
